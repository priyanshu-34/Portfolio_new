# Main site (portfolio + projects + blog under one domain).
# Netlify: base directory "V2"; this file sets the rest.
# For the blog on its own subdomain, create a second Netlify site from this
# repo with base "V2", command "npm run build:blog" and publish "apps/blog/dist".
[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Firebase web config and the admin email are public by design: Vite bakes
  # them into the client bundle, and access is enforced by Firestore rules.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_ADMIN_EMAIL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
