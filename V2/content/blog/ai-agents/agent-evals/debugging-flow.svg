<svg xmlns="http://www.w3.org/2000/svg" width="600" height="536" viewBox="0 0 600 536" role="img" aria-label="Find the cause before you fix anything" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<rect width="600" height="536" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b6cb"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#212121">Find the cause before you fix anything</text>
<g fill="none" stroke="#a9b6cb" stroke-width="1.25"><path d="M150 96V128" marker-end="url(#arrow)"/><path d="M150 200V232" marker-end="url(#arrow)"/><path d="M150 304V336" marker-end="url(#arrow)"/><path d="M150 408V440" marker-end="url(#arrow)"/><path d="M250 164H300" marker-end="url(#arrow)"/><path d="M250 268H300" marker-end="url(#arrow)"/><path d="M250 372H300" marker-end="url(#arrow)"/></g>
<rect x="50" y="56" width="200" height="40" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="150" y="80" text-anchor="middle" fill="#212121" font-weight="600">An eval fails</text>
<polygon points="50,164 150,128 250,164 150,200" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="150" y="168" text-anchor="middle" fill="#212121">Did it run?</text>
<polygon points="50,268 150,232 250,268 150,304" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="150" y="272" text-anchor="middle" fill="#212121">Is the rig proven?</text>
<polygon points="50,372 150,336 250,372 150,408" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="150" y="368" text-anchor="middle" fill="#212121">Fails on another</text><text x="150" y="384" text-anchor="middle" fill="#212121">model too?</text>
<rect x="300" y="136" width="276" height="56" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="438" y="158" text-anchor="middle" fill="#212121" font-weight="600">Setting</text><text x="438" y="176" text-anchor="middle" fill="#475161" font-size="11.5">e.g. the provider timed out: rerun</text>
<rect x="300" y="240" width="276" height="56" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="438" y="262" text-anchor="middle" fill="#212121" font-weight="600">Prove the rig first</text><text x="438" y="280" text-anchor="middle" fill="#475161" font-size="11.5">feed the check a good and a bad answer</text>
<rect x="300" y="344" width="276" height="56" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="438" y="366" text-anchor="middle" fill="#212121" font-weight="600">Agent</text><text x="438" y="384" text-anchor="middle" fill="#475161" font-size="11.5">a model finding: fails on one model only</text>
<rect x="24" y="440" width="252" height="72" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="150" y="462" text-anchor="middle" fill="#212121" font-weight="600">Product or setting</text><text x="150" y="480" text-anchor="middle" fill="#475161" font-size="11.5">check what the model saw</text><text x="150" y="496" text-anchor="middle" fill="#475161" font-size="11.5">and the rules it was given</text>
<text x="275" y="156" text-anchor="middle" fill="#475161" font-size="11.5">no</text><text x="275" y="260" text-anchor="middle" fill="#475161" font-size="11.5">no</text><text x="275" y="364" text-anchor="middle" fill="#475161" font-size="11.5">no</text><text x="160" y="220" text-anchor="start" fill="#475161" font-size="11.5">yes</text><text x="160" y="324" text-anchor="start" fill="#475161" font-size="11.5">yes</text><text x="160" y="428" text-anchor="start" fill="#475161" font-size="11.5">yes</text>
</svg>
