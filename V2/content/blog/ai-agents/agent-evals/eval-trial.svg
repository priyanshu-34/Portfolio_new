<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="An eval runs the agent in a fake world, then grades the record" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<rect width="600" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b6cb"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#212121">An eval runs the agent in a fake world, then grades the record</text>
<g fill="none" stroke="#a9b6cb" stroke-width="1.25"><path d="M188 94H214" marker-end="url(#arrow)"/><path d="M378 94H404" marker-end="url(#arrow)"/><path d="M486 132V180" marker-end="url(#arrow)"/><path d="M404 218H378" marker-end="url(#arrow)"/><path d="M214 218H188" marker-end="url(#arrow)"/></g>
<rect x="24" y="56" width="164" height="76" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="106" y="80" text-anchor="middle" fill="#212121" font-weight="600">Task</text><text x="106" y="100" text-anchor="middle" fill="#475161" font-size="11.5">an input and</text><text x="106" y="116" text-anchor="middle" fill="#475161" font-size="11.5">success criteria</text>
<rect x="214" y="56" width="164" height="76" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="296" y="80" text-anchor="middle" fill="#212121" font-weight="600">Set up the world</text><text x="296" y="100" text-anchor="middle" fill="#475161" font-size="11.5">fake tools and data,</text><text x="296" y="116" text-anchor="middle" fill="#475161" font-size="11.5">clean for each trial</text>
<rect x="404" y="56" width="164" height="76" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="486" y="80" text-anchor="middle" fill="#212121" font-weight="600">Run the agent</text><text x="486" y="100" text-anchor="middle" fill="#475161" font-size="11.5">the real agent,</text><text x="486" y="116" text-anchor="middle" fill="#475161" font-size="11.5">one trial</text>
<rect x="404" y="180" width="164" height="76" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="486" y="204" text-anchor="middle" fill="#212121" font-weight="600">Record</text><text x="486" y="224" text-anchor="middle" fill="#475161" font-size="11.5">the transcript and</text><text x="486" y="240" text-anchor="middle" fill="#475161" font-size="11.5">the end state</text>
<rect x="214" y="180" width="164" height="76" rx="8" fill="#efedfc" stroke="#6c5ce7" stroke-width="2"/><text x="296" y="204" text-anchor="middle" fill="#212121" font-weight="600">Graders</text><text x="296" y="224" text-anchor="middle" fill="#475161" font-size="11.5">code checks,</text><text x="296" y="240" text-anchor="middle" fill="#475161" font-size="11.5">an LLM judge</text>
<rect x="24" y="180" width="164" height="76" rx="8" fill="#ffffff" stroke="#a9b6cb" stroke-width="1.25"/><text x="106" y="204" text-anchor="middle" fill="#212121" font-weight="600">Verdict</text><text x="106" y="224" text-anchor="middle" fill="#475161" font-size="11.5">pass or fail,</text><text x="106" y="240" text-anchor="middle" fill="#475161" font-size="11.5">repeated k times</text>
</svg>
